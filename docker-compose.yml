version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cutover_dashboard_db
    environment:
      POSTGRES_USER: dashboard_user
      POSTGRES_PASSWORD: dashboard_pass
      POSTGRES_DB: cutover_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_user -d cutover_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cutover_dashboard_api
    environment:
      DATABASE_URL: postgresql://dashboard_user:dashboard_pass@postgres:5432/cutover_dashboard
      NODE_ENV: development
      PORT: 5000
      CUTOVER_DATE: 2027-03-01
      BASELINE_DATE: 2026-06-01
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cutover_dashboard_web
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_WS_URL: ws://localhost:5000
      REACT_APP_CUTOVER_DATE: 2027-03-01
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:

networks:
  default:
    name: cutover_dashboard_network
